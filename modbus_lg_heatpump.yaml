# Home Assistant LG Heatpump integration
# last update: 2025-11-10
# validated for Home Assistant 2025.11+

modbus:
  - name: "lg_heatpump"
    type: tcp
    host: !secret lg_heatpump_modbus_host_ip
    port: !secret lg_heatpump_modbus_port

    sensors:
      # --- Input Registers ---
      - name: "hp_error_code"
        unique_id: "modbus.hp_error_code"
        address: 0
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        scan_interval: 10

      - name: "hp_odu_operation_cycle"
        unique_id: "modbus.hp_odu_operation_cycle"
        address: 1
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        scan_interval: 10

      - name: "hp_inlet_temp"
        unique_id: "modbus.hp_inlet_temp"
        address: 2
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_outlet_temp"
        unique_id: "modbus.hp_outlet_temp"
        address: 3
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_backup_heater_outlet_temp"
        unique_id: "modbus.hp_backup_heater_outlet_temp"
        address: 4
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_dhw_water_temp"
        unique_id: "modbus.hp_dhw_water_temp"
        address: 5
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_solar_collector_temp"
        unique_id: "modbus.hp_solar_collector_temp"
        address: 6
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_temp_technikraum"
        unique_id: "modbus.hp_temp_technikraum"
        address: 7
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 10

      - name: "hp_flow_rate"
        unique_id: "modbus.hp_flow_rate"
        address: 8
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "l/min"
        scale: 0.1
        precision: 1
        scan_interval: 10

      - name: "hp_flow_temp_circle_2"
        unique_id: "modbus.hp_flow_temp_circle_2"
        address: 9
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 10

      - name: "hp_room_air_temp_circuit2_input"
        unique_id: "modbus.hp_room_air_temp_circuit2_input"
        address: 10
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 10

      - name: "hp_energy_state_input"
        unique_id: "modbus.hp_energy_state_input"
        address: 11
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        scan_interval: 10

      - name: "hp_outside_temp"
        unique_id: "modbus.hp_outside_temp"
        address: 12
        slave: !secret lg_heatpump_modbus_slave
        input_type: input
        unit_of_measurement: "°C"
        device_class: temperature
        scale: 0.1
        precision: 1
        scan_interval: 10

      # --- Holding Registers ---
      - name: "hp_operation_mode"
        unique_id: "modbus.hp_operation_mode"
        address: 0
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        scan_interval: 60

      - name: "hp_control_method"
        unique_id: "modbus.hp_control_method"
        address: 1
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        scan_interval: 60

      - name: "hp_target_temp_circuit1"
        unique_id: "modbus.hp_target_temp_circuit1"
        address: 2
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        unit_of_measurement: "°C"
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_shift_value_in_auto_mode_circuit1"
        unique_id: "modbus.hp_shift_value_in_auto_mode_circuit1"
        address: 4
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        unit_of_measurement: "°C"
        data_type: int16
        precision: 1
        scan_interval: 30

      - name: "hp_target_temp_circuit2"
        unique_id: "modbus.hp_target_temp_circuit2"
        address: 5
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        unit_of_measurement: "°C"
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_shift_value_in_auto_mode_circuit2"
        unique_id: "modbus.hp_shift_value_in_auto_mode_circuit2"
        address: 7
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        unit_of_measurement: "°C"
        data_type: int16
        precision: 1
        scan_interval: 30

      - name: "hp_dhw_target_temp"
        unique_id: "modbus.hp_dhw_target_temp"
        address: 8
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        unit_of_measurement: "°C"
        scale: 0.1
        precision: 1
        scan_interval: 30

      - name: "hp_energy_state_input_raw"
        unique_id: "modbus.hp_energy_state_input_raw"
        address: 9
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding
        scan_interval: 10

template:
  # Sensor for calculating the COP
    # Please use your heat pump's own power sensor to calculate the COP.
    # In my example, it is the value of a Shelly 3EM. If your Heatpump provide a power sensor, feel free to use it.

  - sensor:
      - name: "Heat Output"
        unique_id: hp_heat_output
        unit_of_measurement: "kW"
        state_class: "measurement"
        device_class: "power"
        availability: >-
          {{ states('sensor.hp_flow_rate') not in ['unknown', 'unavailable'] and
            states('sensor.hp_inlet_temp') not in ['unknown', 'unavailable'] and
            states('sensor.hp_outlet_temp') not in ['unknown', 'unavailable'] }}
        state: >-
          {% set flow_rate = states('sensor.hp_flow_rate') | float(0) %}
          {% set temp_inlet = states('sensor.hp_inlet_temp') | float(0) %}
          {% set temp_outlet = states('sensor.hp_outlet_temp') | float(0) %}
          {% set delta_t = temp_outlet - temp_inlet %}
          {% if flow_rate < 6 %}
            {% set flow_rate = 0 %}
          {% endif %}
          {% set power = flow_rate * 69.77 * delta_t / 1000 %}
          {{ [power, 0] | max | round(2) }}

      - name: "Heatpump COP"
        unique_id: hp_cop
        unit_of_measurement: ""
        state_class: "measurement"
        icon: >-
          {% set cop = states('sensor.hp_cop') | float(0) %}
          {% if cop == 0 %}
            mdi:power-off
          {% elif cop < 2.5 %}
            mdi:speedometer-slow
          {% elif cop < 3.5 %}
            mdi:speedometer-medium
          {% elif cop < 4.5 %}
            mdi:speedometer
          {% else %}
            mdi:rocket-launch
          {% endif %}
        availability: >-
          {{ states('sensor.hp_power') not in ['unknown', 'unavailable'] and
            states('sensor.hp_heat_output') not in ['unknown', 'unavailable'] }}
        state: >-
          {% set power = states('sensor.hp_power') | float(0) / 1000 %}
          {% set leistung = states('sensor.hp_heat_output') | float(0) %}
          {% if power > 0.7 %}
            {{ max((leistung / power) | round(2), 0) }}
          {% else %}
            0
          {% endif %}

  - sensor:
      - name: "HP Energy State"
        unique_id: "hp_energy_state_label"
        state: >
            {% set v = states('sensor.hp_energy_state_input_raw') | int(-1) %}
            {% if v == 0 %} Nicht verwenden
            {% elif v == 1 %} Erzwungen Aus
            {% elif v == 2 %} Normalbetrieb
            {% elif v == 3 %} Ein-Empfehlung
            {% elif v == 4 %} Ein-Befehl
            {% elif v == 5 %} Ein-Befehl Schritt 2
            {% elif v == 6 %} Ein-Empfehlung Schritt 1
            {% elif v == 7 %} Energiesparmodus
            {% elif v == 8 %} Superenergiesparmodus
            {% else %} Unknown
            {% endif %}

automation:
  - id: "hp_automation_set_shift_value_in_auto_mode_circuit1_input_slider_update"
    alias: "Shift Value HK1 Input Slider Update"
    trigger:
      - platform: state
        entity_id: sensor.hp_shift_value_in_auto_mode_circuit1
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.hp_shift_value_in_auto_mode_circuit1
        data:
          value: "{{ states('sensor.hp_shift_value_in_auto_mode_circuit1') }}"

  - id: "hp_automation_set_shift_value_in_auto_mode_circuit2_input_slider_update"
    alias: "Shift Value HK2 Input Slider Update"
    trigger:
      - platform: state
        entity_id: sensor.hp_shift_value_in_auto_mode_circuit2
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.hp_shift_value_in_auto_mode_circuit2
        data:
          value: "{{ states('sensor.hp_shift_value_in_auto_mode_circuit2') }}"

  - id: "hp_automation_set_target_temperatur_input_slider_update"
    alias: "DHW Zieltemperatur Input Slider Update"
    trigger:
      - platform: state
        entity_id: sensor.hp_dhw_target_temp
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.hp_dhw_target_temperatur
        data:
          value: "{{ states('sensor.hp_dhw_target_temp') }}"
