# Home Assistant LG Heatpump integration
# LG Therma V R290
# last update: 2026-08-06 Kompressorleistung %

modbus:
  - name: "lg_heatpump"
    type: serial
    port: /dev/serial/by-id/usb-Prolific_Technology_Inc._USB-Serial_Controller-if00-port0
    baudrate: 9600
    bytesize: 8
    method: rtu
    parity: N
    stopbits: 1

    #------------------------------------------
    sensors:
      # Technische Daten
      # Input Register
      #------------------------------------------

      - name: "hp_error_code"
        unique_id: "modbus.hp_error_code"
        address: 0 # reg 01
        input_type: input
        slave: 1
        scan_interval: 10

      - name: "hp_odu_operation_cycle"
        unique_id: "modbus.hp_odu_operation_cycle"
        address: 1 # reg 02
        input_type: input
        slave: 1
        scan_interval: 10

      - name: "hp_inlet_temp"
        unique_id: "modbus.hp_inlet_temp"
        address: 2 # reg 03
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_outlet_temp"
        unique_id: "modbus.hp_outlet_temp"
        address: 3 # reg 04
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_backup_heater_outlet_temp"
        unique_id: "modbus.hp_backup_heater_outlet_temp"
        address: 4 # reg 05
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_dhw_water_temp"
        unique_id: "modbus.hp_dhw_water_temp"
        address: 5 # reg 06
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_solar_collector_temp"
        unique_id: "modbus.hp_solar_collector_temp"
        address: 6 # reg 07
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_temp_technikraum" # Temperatur Technikraum
        unique_id: "modbus.hp_temp_technikraum"
        address: 7 # reg 08
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_flow_rate"
        unique_id: "modbus.hp_flow_rate"
        address: 8 # reg 09
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: L/min
        device_class: volume_flow_rate
        scan_interval: 10

      - name: "hp_flow_temp_circle_2"
        unique_id: "modbus.hp_flow_temp_circle_2"
        address: 9 # reg 10
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_room_air_temp_circuit2_input"
        unique_id: "modbus.hp_room_air_temp_circuit2_input"
        address: 10 # reg 11
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_energy_state_input"
        unique_id: "modbus.hp_energy_state_input"
        address: 11 # reg 12
        input_type: input
        slave: 1
        scan_interval: 10

      - name: "hp_outside_temp" # Außentemperatur
        unique_id: "modbus.hp_outside_temp"
        address: 12 # reg 13
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_water_pressure" # Wasserdruck
        unique_id: "modbus.hp_water_pressure"
        address: 13 # reg 14
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: bar
        device_class: pressure
        scan_interval: 10

      - name: "hp_temp_liquid_gas" # Temperatur Flüssiggas [0.1 °C ×10]
        unique_id: "modbus.hp_temp_liquid_gas"
        address: 16 # reg 17
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_temp_pipe_out" # Pipe out temp [0.01 °C ×10]
        unique_id: "modbus.hp_temp_pipe_out"
        address: 17 # reg 18
        input_type: input
        slave: 1
        scale: 0.01
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_temp_suction" # Temperatur Absaugung [0.1 °C ×10]
        unique_id: "modbus.hp_temp_suction"
        address: 18 # reg 19
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_temp_heatgas" # Heißgastemperatur [0.1 °C ×10]
        unique_id: "hp_modbus.temp_heatgas"
        address: 19 # reg 20
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_temp_before_vaporiser" # Dampftemperatur vor Verdampfer
        unique_id: "modbus.hp_temp_before_vaporiser"
        address: 20 # reg 21
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_temp_after_vaporiser" # Dampftemperatur nach Verdampfer
        unique_id: "modbus.hp_temp_after_vaporiser"
        address: 21 # reg 22
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        device_class: temperature
        scan_interval: 10

      - name: "hp_high_pressure" # Dampfdruck Kondensator [0.1 °C ×10]
        unique_id: "hp_modbus.high_pressure"
        address: 22 # reg 23
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: bar
        device_class: pressure
        scan_interval: 10

      - name: "hp_low_pressure" # Dampfdruck Verdampfer [0.1 °C ×10]
        unique_id: "modbus.hp_low_pressure"
        address: 23 # reg 24
        input_type: input
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: bar
        device_class: pressure
        scan_interval: 10

      - name: "hp_compressor_rpm" # Kompressordrehzahl
        unique_id: "modbus.hp_compressor_rpm"
        address: 24 # reg 25
        input_type: input
        slave: 1
        scale: 60
        precision: 0.1
        unit_of_measurement: U/min
        scan_interval: 10

      - name: "hp_ENERGY_INSTANTANEOUS_TOTAL_SYSTEM"
        unique_id: "modbus.hp_ENERGY_INSTANTANEOUS_TOTAL_SYSTEM"
        address: 34
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scan_interval: 10

      - name: "hp_ENERGY_INSTANTANEOUS_TOTAL"
        unique_id: "modbus.hp_ENERGY_INSTANTANEOUS_TOTAL"
        address: 36
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scan_interval: 10

      - name: "hp_ENERGY_ACCUMULATIVE_TOTAL"
        unique_id: "modbus.hp_ENERGY_ACCUMULATIVE_TOTAL"
        address: 38
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: Wh
        device_class: energy
        state_class: total
        scan_interval: 10
        
      - name: "hp_ENERGY_ACCUMULATIVE_HEAT"
        unique_id: "modbus.hp_ENERGY_ACCUMULATIVE_HEAT"
        address: 40
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: Wh
        device_class: energy
        state_class: total
        scan_interval: 10

      - name: "hp_ENERGY_ACCUMULATIVE_COOL"
        unique_id: "modbus.hp_ENERGY_ACCUMULATIVE_COOL"
        address: 42
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: Wh
        device_class: energy
        state_class: total
        scan_interval: 10

      - name: "hp_ENERGY_ACCUMULATIVE_DHW"
        unique_id: "modbus.hp_ENERGY_ACCUMULATIVE_DHW"
        address: 44
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: Wh
        device_class: energy
        state_class: total
        scan_interval: 10

      - name: "hp_COP"
        unique_id: "hp_COP"
        address: 46
        input_type: input
        slave: 1
        data_type: uint32
        scale: 0.1
        precision: 2
        device_class: power_factor
        scan_interval: 10

      - name: "hp_ENERGY_INSTANTANEOUS_TOTAL_TH"
        unique_id: "modbus.hp_ENERGY_INSTANTANEOUS_TOTAL_TH"
        address: 48
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scan_interval: 10
        
      - name: "hp_ENERGY_ACCUMULATIVE_HEAT_TH"
        unique_id: "modbus.hp_ENERGY_ACCUMULATIVE_HEAT_TH"
        address: 50
        input_type: input
        slave: 1
        data_type: uint32
        precision: 2
        unit_of_measurement: Wh
        device_class: energy
        state_class: total
        scan_interval: 10

#      - name: "hp_ENERGY_ACCUMULATIVE_COOL_TH"
#        unique_id: "modbus.hp_ENERGY_ACCUMULATIVE_COOL_TH"
#        address: 52
#        input_type: input
#        slave: 1
#        data_type: uint32
#        precision: 2
#        unit_of_measurement: Wh
#        device_class: energy
#        state_class: total
#        scan_interval: 10

#      - name: "hp_ENERGY_ACCUMULATIVE_DHW_TH"
#        unique_id: "modbus.hp_ENERGY_ACCUMULATIVE_DHW_TH"
#        address: 54
#        input_type: input
#        slave: 1
#        data_type: uint32
#        precision: 2
#        unit_of_measurement: Wh
#        device_class: energy
#        state_class: total
#        scan_interval: 10

      - name: "hp_product_group" # Produktgruppe
        unique_id: "modbus.hp_product_group"
        address: 9997
        input_type: input
        slave: 1
        scan_interval: 60

      - name: "hp_product_info" # Produktinfos
        unique_id: "modbus.hp_product_info"
        address: 9998
        input_type: input
        slave: 1
        scan_interval: 60

      #------------------------------------------
      # Holding Register
      #------------------------------------------

      - name: "hp_operation_mode"
        unique_id: "modbus.hp_operation_mode"
        address: 0 # reg 40001
        input_type: holding
        slave: 1
        scan_interval: 10

      - name: "hp_control_method"
        unique_id: "modbus.hp_control_method"
        address: 1 # reg 40002
        input_type: holding
        slave: 1
        scan_interval: 10

      - name: "hp_target_temp_circuit1" #Zieltemperatur HK1 (Heizkörper)
        unique_id: "modbus.hp_target_temp_circuit1"
        address: 2 # reg 40003
        input_type: holding
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        scan_interval: 10

      - name: "hp_room_air_temp_circuit1"
        unique_id: "modbus.hp_room_air_temp_circuit1"
        address: 3 # reg 40004
        input_type: holding
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        scan_interval: 10

      - name: "hp_shift_value_in_auto_mode_circuit1" #Sollwertverschiebung HK1 (Heizkörper)
        unique_id: "modbus.hp_shift_value_in_auto_mode_circuit1"
        address: 4 # reg 40005
        input_type: holding
        slave: 1
        scale: 1
        precision: 2
        unit_of_measurement: °C
        scan_interval: 10

      - name: "hp_target_temp_circuit2" #Zieltemperatur HK2 (Fußbodenheizung)
        unique_id: "modbus.hp_target_temp_circuit2"
        address: 5 # reg 40006
        input_type: holding
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        scan_interval: 10

      - name: "hp_room_air_temp_circuit2" #Sollwertverschiebung HK2 (Fußbodenheizung)
        unique_id: "modbus.hp_room_air_temp_circuit2"
        address: 6 # reg 40007
        input_type: holding
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        scan_interval: 10

      - name: "hp_shift_value_in_auto_mode_circuit2" #Sollwertverschiebung HK2 (Fußbodenheizung)
        unique_id: "modbus.hp_shift_value_in_auto_mode_circuit2"
        address: 7 # reg 40008
        input_type: holding
        slave: 1
        scale: 1
        precision: 2
        unit_of_measurement: °C
        scan_interval: 10

      - name: "hp_dhw_target_temp" #DHW Zieltemperatur
        unique_id: "modbus.hp_dhw_target_temp"
        address: 8 # reg 40009
        input_type: holding
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: °C
        scan_interval: 10

      - name: "hp_energy_state_input_raw"
        unique_id: "modbus.hp_energy_state_input_raw"
        address: 9 # reg 40010
        input_type: holding
        slave: 1
        scan_interval: 10

      - name: "hp_compressor_modulation" # 0: Not used/ 40-100: Compressor Modulation in % of max rpm
        unique_id: "modbus.hp_compressor_modulation"
        address: 23 # reg 40024
        input_type: holding
        slave: 1
        precision: 1
        unit_of_measurement: "%"
        scan_interval: 10

      - name: "hp_power_limitation" # 0: Not used/ 0.1-25.0 kW: Power Limitation
        unique_id: "modbus.hp_power_limitation"
        address: 24 # reg 40025
        input_type: holding
        slave: 1
        scale: 0.1
        precision: 2
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        scan_interval: 10

    # -------------------------------------------------
    switches:
      # coil_register (binäre Daten, nur schreiben)
      # -------------------------------------------------
      - name: "hp_hauptschalter" # Wärmepumpe an/aus
        unique_id: "modbus.hp_hauptschalter"
        address: 0
        write_type: coil
        slave: 1
        command_on: 1
        command_off: 0
        verify:
          address: 0
          input_type: coil
          state_on: 1
          state_off: 0

      - name: "hp_dhw" # Warmwasserbereitung an/aus
        unique_id: "modbus.hp_dhw"
        address: 1
        write_type: coil
        slave: 1
        command_on: 1
        command_off: 0
        verify:
          address: 1
          input_type: coil
          state_on: 1
          state_off: 0

      - name: "hp_silent_mode" # Ruhemodus an/aus
        unique_id: "modbus.hp_silent_mode"
        address: 2
        write_type: coil
        slave: 1
        command_on: 1
        command_off: 0
        verify:
          address: 2
          input_type: coil
          state_on: 1
          state_off: 0

      - name: "hp_dhw_desinfection_mode" # Desinfektionsmodus an/aus
        unique_id: "modbus.hp_dhw_desinfection_mode"
        address: 3
        write_type: coil
        slave: 1
        command_on: 1
        command_off: 0
        verify:
          address: 3
          input_type: coil
          state_on: 1
          state_off: 0

      - name: "hp_emergency_stop_switch_off" # Notaus Normaler Betrieb / Notaus
        unique_id: "modbus.hp_emergency_stop_switch_off"
        address: 4
        write_type: coil
        slave: 1
        command_on: 1
        command_off: 0
        verify:
          address: 4
          input_type: coil
          state_on: 1
          state_off: 0

      - name: "hp_emergency_stop_switch_on" # Notaus Status halten / Betriebsstart
        unique_id: "modbus.hp_emergency_stop_switch_on"
        address: 5
        write_type: coil
        slave: 1
        command_on: 1
        command_off: 0
        verify:
          address: 5
          input_type: coil
          state_on: 1
          state_off: 0

      - name: "hp_active_power_limit" # Wirkleistungsbegrenzung an/aus
        unique_id: "modbus.hp_active_power_limit"
        address: 6
        write_type: coil
        slave: 1
        command_on: 1
        command_off: 0
        verify:
          address: 6
          input_type: coil
          state_on: 1
          state_off: 0

    # -----------------------------------------
    binary_sensors:
      # discrete_input (binäre Daten, nur lesen)
      # -----------------------------------------
      - name: "hp_water_flow_status"
        unique_id: "modbus.hp_water_flow_status"
        address: 0
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_water_pump_status"
        unique_id: "modbus.hp_water_pump_status"
        address: 1
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_ext_water_pump_status"
        unique_id: "modbus.hp_ext_water_pump_status"
        address: 2
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_compressor_status"
        unique_id: "modbus.hp_compressor_status"
        address: 3
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_defrosting_status"
        unique_id: "modbus.hp_defrosting_status"
        address: 4
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_dhw_heating_status"
        unique_id: "modbus.hp_dhw_heating_status"
        address: 5
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_dhw_tank_desinfection_status"
        unique_id: "modbus.hp_dhw_tank_desinfection_status"
        address: 6
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_silent_mode_status"
        unique_id: "modbus.hp_silent_mode_status"
        address: 7
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_cooling_status"
        unique_id: "modbus.hp_cooling_status"
        address: 8
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_solar_pump_status"
        unique_id: "modbus.hp_solar_pump_status"
        address: 9
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_backup_heater_step1_status"
        unique_id: "modbus.hp_backup_heater_step1_status"
        address: 10
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_backup_heater_step2_status"
        unique_id: "modbus.hp_backup_heater_step2_status"
        address: 11
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_dhw_boost_heater_status"
        unique_id: "modbus.hp_dhw_boost_heater_status"
        address: 12
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_error_status"
        unique_id: "modbus.hp_error_status"
        address: 13
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_emergency_operation_available_space_heating/cooling"
        unique_id: "modbus.hp_emergency_operation_available_space_heating_cooling"
        address: 14
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_emergency_operation_available_dhw"
        unique_id: "modbus.hp_emergency_operation_available_dhw"
        address: 15
        input_type: discrete_input
        slave: 1
        scan_interval: 10

      - name: "hp_mix_pump_status"
        unique_id: "modbus.hp_mix_pump_status"
        address: 16
        input_type: discrete_input
        slave: 1
        scan_interval: 10

input_number:
  # Input Number
  # -----------------------------------------
  hp_shift_value_in_auto_mode_circuit1:
    name: "Set HP Sollwertverschiebung im AI Modus - HK1 (Heizkörper)"
    min: -5
    max: 5
    step: 1

  hp_shift_value_in_auto_mode_circuit2:
    name: "Set HP Sollwertverschiebung im AI Modus - HK2 (Fußbodenheizung)"
    min: -5
    max: 5
    step: 1

  hp_hk1_target_temperatur:
    name: "Soll Temperatur HK1 #Zieltemperatur HK1 Heizkörper"
    min: 20
    max: 60
    step: 1

  hp_hk2_target_temperatur:
    name: "Soll Temperatur HK2 #Zieltemperatur HK2Fußbodenheizung"
    min: 20
    max: 40
    step: 1

  hp_dhw_target_temperatur:
    name: "Soll Temperatur DHW"
    min: 40
    max: 60
    step: 1

  hp_compressor_modulation_max: 
    name: "Kompressordrehzahl (maximal) in %"
    min: 40
    max: 100
    step: 1

input_select:
  # Input Select
  # -----------------------------------------
  hp_set_operation_mode:
    name: "Selector Heatpump Operation Mode"
    options:
      - "Kühlen"
      - "Heizen"
      - "Auto"

  hp_set_control_method:
    name: "Selector Heatpump Control Method"
    options:
      - "Wasserauslasstemp. Steuerung"
      - "Wassereinlasstemp. Steuerung"
      - "Raumluftsteuerung"

template:
  # Template sensors for better readability
  #-----------------------------------------
  - sensor:
      - name: "HP Energy State"
        unique_id: "hp_energy_state_label"
        state: >
            {% set v = states('sensor.hp_energy_state_input_raw') | int(-1) %}
            {% if v == 0 %} Nicht verwenden
            {% elif v == 1 %} Erzwungen Aus
            {% elif v == 2 %} Normalbetrieb
            {% elif v == 3 %} Ein-Empfehlung
            {% elif v == 4 %} Ein-Befehl
            {% elif v == 5 %} Ein-Befehl Schritt 2
            {% elif v == 6 %} Ein-Empfehlung Schritt 1
            {% elif v == 7 %} Energiesparmodus
            {% elif v == 8 %} Superenergiesparmodus
            {% else %} Unknown
            {% endif %}

# ---------------------------------------------------------------------------------------------------------------
# Automations: Write modbus registers on input changes via GUI
# note: If you change a value by the sliders, it will take up to 60 seconds until the state variables are updated
# ---------------------------------------------------------------------------------------------------------------

automation:
  ### Input Select Operation Mode ###
  #-------------------------------------------------------------------------------
  - id: "hp_automation_operation_mode_modbus_update"
    alias: "[Heatpump] Operation Mode Modbus Update"
    description: "Select Operation Mode of Heatpump - send via Modbus"
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - input_select.hp_set_operation_mode
    condition: []
    variables:
      kuehlen: 0
      auto: 3
      heizen: 4
    action:
      - action: modbus.write_register
        data:
          hub: lg_heatpump
          slave: 1
          address: 0
          value: >-
            {% if is_state('input_select.hp_set_operation_mode', 'Kühlen') %} {{kuehlen}}
            {% elif is_state('input_select.hp_set_operation_mode', 'Heizen') %} {{heizen}}
            {% else %}
            {{auto}}
            {% endif %}

  - id: "hp_automation_operation_mode_input_select_update"
    alias: "[Heatpump] Operation Mode InputSelect Update"
    description: "Select Operation Mode of Heatpump - Read from State"
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - sensor.hp_operation_mode
    condition: []
    action:
      - action: input_select.select_option
        target:
          entity_id: input_select.hp_set_operation_mode
        data:
          option: >
            {% if is_state('sensor.hp_operation_mode', '3') %}
            Auto
            {% elif is_state('sensor.hp_operation_mode', '4') %}
            Heizen
            {% else %}
            Kühlen
            {% endif %}

  ### Input Select Control Mode ###
  #-------------------------------------------------------------------------------

  - id: "hp_automation_control_method_modbus_update"
    alias: "[Heatpump] Control Method Modbus Update"
    description: "Select Control Method of Heatpump - send via Modbus"
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - input_select.hp_set_control_method
    condition: []
    variables:
      auslass: 0
      einlass: 1
      raumluft: 2
    action:
      - action: modbus.write_register
        data:
          hub: lg_heatpump
          slave: 1
          address: 1
          value: >-
            {% if is_state('input_select.hp_set_control_method', 'Wasserauslasstemp. Steuerung') %}
            {{auslass}}
            {% elif is_state('input_select.hp_set_control_method', 'Wassereinlasstemp. Steuerung') %}
            {{einlass}}
            {% else %}
            {{raumluft}}
            {% endif %}

  - id: "hp_automation_control_method_input_select_update"
    alias: "[Heatpump] Control Method InputSelect Update"
    description: "Select Control Method of Heatpump - Read from State"
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - sensor.hp_control_method
    condition: []
    action:
      - action: input_select.select_option
        target:
          entity_id: input_select.hp_set_control_method
        data:
          option: >
            {% if is_state('sensor.hp_control_method', '0') %}
            Wasserauslasstemp. Steuerung
            {% elif is_state('sensor.hp_control_method', '1') %}
            Wassereinlasstemp. Steuerung
            {% else %}
            Raumluftsteuerung
            {% endif %}

