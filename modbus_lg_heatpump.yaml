# Home Assistant LG Heatpump integration
# last update: 2026-05-05 (for Homeassistant update 2026.05)

modbus:
  - name: "lg_heatpump"
    type: tcp
    host: !secret lg_heatpump_modbus_host_ip
    port: !secret lg_heatpump_modbus_port
    timeout: 5
    retries: 3
    #------------------------------------------
    sensors:
      # Technische Daten
      # Input Register
      #------------------------------------------

      - name: "hp_error_code"
        unique_id: "modbus.hp_error_code"
        scan_interval: 10
        address: 0 # 30001
        slave: !secret lg_heatpump_modbus_slave
        input_type: input

      - name: "hp_odu_operation_cycle"
        unique_id: "modbus.hp_odu_operation_cycle"
        scan_interval: 10
        address: 1 # 30002
        slave: !secret lg_heatpump_modbus_slave
        input_type: input

      - name: "hp_inlet_temp"
        unique_id: "modbus.hp_inlet_temp"
        scale: 0.1
        precision: 1
        scan_interval: 30
        address: 2 # 30003
        slave: !secret lg_heatpump_modbus_slave
        unit_of_measurement: °C
        device_class: temperature
        input_type: input

      - name: "hp_outlet_temp"
        unique_id: "modbus.hp_outlet_temp"
        scale: 0.1
        precision: 1
        scan_interval: 30
        address: 3 # 30004
        slave: !secret lg_heatpump_modbus_slave
        unit_of_measurement: °C
        device_class: temperature
        input_type: input

      - name: "hp_backup_heater_outlet_temp"
        unique_id: "modbus.hp_backup_heater_outlet_temp"
        scale: 0.1
        precision: 1
        scan_interval: 30
        address: 4 # reg 5
        slave: !secret lg_heatpump_modbus_slave
        unit_of_measurement: °C
        device_class: temperature
        input_type: input

      - name: "hp_dhw_water_temp"
        unique_id: "modbus.hp_dhw_water_temp"
        scale: 0.1
        precision: 1
        scan_interval: 30
        address: 5 # 30006
        slave: !secret lg_heatpump_modbus_slave
        unit_of_measurement: °C
        device_class: temperature
        input_type: input

      - name: "hp_solar_collector_temp"
        unique_id: "modbus.hp_solar_collector_temp"
        scale: 0.1
        precision: 1
        scan_interval: 30
        address: 6 # reg 7
        slave: !secret lg_heatpump_modbus_slave
        unit_of_measurement: °C
        device_class: temperature
        input_type: input

      - name: "hp_temp_technikraum" # Temperatur Technikraum
        unique_id: "modbus.hp_temp_technikraum"
        precision: 1
        scan_interval: 10
        address: 7 # 30008
        slave: !secret lg_heatpump_modbus_slave
        scale: 0.1
        device_class: temperature
        unit_of_measurement: "°C"
        input_type: input

      - name: "hp_flow_rate"
        unique_id: "modbus.hp_flow_rate"
        precision: 1
        scale: 0.1
        scan_interval: 10
        address: 8 # 30009
        slave: !secret lg_heatpump_modbus_slave
        device_class: volume_flow_rate
        unit_of_measurement: "l/min"
        input_type: input

      - name: "hp_flow_temp_circle_2"
        unique_id: "modbus.hp_flow_temp_circle_2"
        scale: 0.1
        precision: 1
        scan_interval: 10
        address: 9 # 30010
        slave: !secret lg_heatpump_modbus_slave
        device_class: temperature
        unit_of_measurement: °C
        input_type: input

      - name: "hp_room_air_temp_circuit2_input"
        unique_id: "modbus.hp_room_air_temp_circuit2_input"
        precision: 1
        scan_interval: 10
        address: 10 # 30011
        slave: !secret lg_heatpump_modbus_slave
        scale: 0.1
        device_class: temperature
        unit_of_measurement: "°C"
        input_type: input

      - name: "hp_energy_state_input"
        unique_id: "modbus.hp_energy_state_raw"
        scan_interval: 10
        address: 11 # 30012
        slave: !secret lg_heatpump_modbus_slave
        input_type: input

      - name: "hp_outside_temp" # Außentemperatur
        unique_id: "modbus.hp_outside_temp"
        precision: 1
        scan_interval: 10
        address: 12 # 30013
        slave: !secret lg_heatpump_modbus_slave
        scale: 0.1
        device_class: temperature
        unit_of_measurement: "°C"
        input_type: input

      - name: "hp_water_pressure"
        unique_id: "modbus.hp_water_pressure"
        scan_interval: 10
        address: 12 # 30013
        slave: !secret lg_heatpump_modbus_slave
        device_class: pressure
        unit_of_measurement: Bar
        input_type: input

      - name: "hp_temp_liquid_gas"
        unique_id: "modbus.hp_temp_liquid_gas"
        scan_interval: 10
        address: 16 # 30017
        device_class: temperature
        unit_of_measurement: "°C"
        slave: !secret lg_heatpump_modbus_slave
        input_type: input

      - name: "hp_temp_suction" # Temperatur Absaugung
        unique_id: "modbus.hp_temp_suction"
        scan_interval: 2
        address: 18 # 30019
        device_class: temperature
        unit_of_measurement: °C
        slave: !secret lg_heatpump_modbus_slave
        input_type: input

      - name: "hp_temp_heatgas" # Heißgastemperatur
        unique_id: "hp_modbus.temp_heatgas"
        address: 19
        device_class: temperature
        unit_of_measurement: °C
        slave: !secret lg_heatpump_modbus_slave
        input_type: input

      - name: "hp_temp_before_vaporiser" # Dampftemperatur vor Verdampfer
        unique_id: "modbus.hp_temp_before_vaporiser"
        precision: 1
        scan_interval: 10
        address: 20
        scale: 0.1
        device_class: temperature
        unit_of_measurement: "°C"
        slave: !secret lg_heatpump_modbus_slave
        input_type: input

      - name: "hp_temp_after_vaporiser" # Dampftemperatur nach Verdampfer
        unique_id: "modbus.hp_temp_after_vaporiser"
        precision: 1
        scan_interval: 10
        address: 21
        scale: 0.1
        device_class: temperature
        unit_of_measurement: "°C"
        slave: !secret lg_heatpump_modbus_slave
        input_type: input

      - name: "hp_high_pressure" # Dampfdruck Kondensator
        unique_id: "hp_modbus.high_pressure"
        address: 22
        device_class: pressure
        unit_of_measurement: Bar
        slave: !secret lg_heatpump_modbus_slave
        input_type: input

      - name: "hp_low_pressure" # Dampfdruck Verdampfer
        unique_id: "modbus.hp_low_pressure"
        address: 23
        device_class: pressure
        unit_of_measurement: Bar
        slave: !secret lg_heatpump_modbus_slave
        input_type: input

      - name: "hp_compressor_rpm" # Kompressordrehzahl
        unique_id: "modbus.hp_compressor_rpm"
        scale: 60
        precision: 0.1
        scan_interval: 10
        address: 24
        slave: !secret lg_heatpump_modbus_slave
        unit_of_measurement: U/min
        input_type: input

      - name: "hp_product_info" # Produktinfos
        unique_id: "modbus.hp_product_info"
        scan_interval: 60
        address: 9998
        slave: !secret lg_heatpump_modbus_slave
        input_type: input

      # Holding Register
      #------------------------------------------

      - name: "hp_operation_mode_raw"
        unique_id: "modbus.hp_operation_mode_raw"
        scan_interval: 60
        address: 0 # 40001
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding

      - name: "hp_control_method_raw"
        unique_id: "modbus.hp_control_method_raw"
        scan_interval: 60
        address: 1 # 40002
        slave: !secret lg_heatpump_modbus_slave
        input_type: holding

      - name: "hp_target_temp_circuit1" #Zieltemperatur HK1 (Heizkörper)
        unique_id: "modbus.hp_target_temp_circuit1"
        scale: 0.1
        precision: 1
        scan_interval: 30
        address: 2 # 40003
        slave: !secret lg_heatpump_modbus_slave
        unit_of_measurement: °C
        input_type: holding

      - name: "hp_room_air_temp_circuit1"
        unique_id: "modbus.hp_room_air_temp_circuit1"
        scale: 0.1
        precision: 1
        scan_interval: 30
        address: 3 # 40004
        slave: !secret lg_heatpump_modbus_slave
        unit_of_measurement: "°C"
        input_type: holding

      - name: "hp_shift_value_in_auto_mode_circuit1" #Sollwertverschiebung HK1 (Heizkörper)
        unique_id: "modbus.hp_shift_value_in_auto_mode_circuit1"
        precision: 1
        scan_interval: 30
        address: 4 # 40005
        #data_type: int16
        slave: !secret lg_heatpump_modbus_slave
        unit_of_measurement: °C
        input_type: holding

      - name: "hp_target_temp_circuit2" #Zieltemperatur HK2 (Fußbodenheizung)
        unique_id: "modbus.hp_target_temp_circuit2"
        scale: 0.1
        precision: 1
        scan_interval: 30
        address: 5 # 40006
        slave: !secret lg_heatpump_modbus_slave
        unit_of_measurement: °C
        input_type: holding

      - name: "hp_room_air_temp_circuit2"
        unique_id: "modbus.hp_room_air_temp_circuit2"
        scale: 0.1
        precision: 1
        scan_interval: 30
        address: 6 # 40007
        slave: !secret lg_heatpump_modbus_slave
        unit_of_measurement: "°C"
        input_type: holding

      - name: "hp_shift_value_in_auto_mode_circuit2" #Sollwertverschiebung HK2 (Fußbodenheizung)
        unique_id: "modbus.hp_shift_value_in_auto_mode_circuit2"
        precision: 1
        scan_interval: 30
        address: 7 # 40008
        #data_type: int16
        slave: !secret lg_heatpump_modbus_slave
        unit_of_measurement: °C
        input_type: holding

      - name: "hp_dhw_target_temp" #DHW Zieltemperatur
        unique_id: "modbus.hp_dhw_target_temp"
        scale: 0.1
        precision: 1
        scan_interval: 30
        address: 8 # 40009
        slave: !secret lg_heatpump_modbus_slave
        unit_of_measurement: °C
        input_type: holding

      - name: "LG WP Energiezustand-Eingang"
        unique_id: "modbus.hp_energy_state_input_raw"
        slave: !secret lg_heatpump_modbus_slave
        scan_interval: 10
        address: 9 # 40010
        input_type: holding
      
      - name: "hp_power_limit"
        unique_id: "modbus.hp_power_limit"
        precision: 1
        scan_interval: 10
        address: 24 # 40025
        slave: !secret lg_heatpump_modbus_slave
        device_class: power
        unit_of_measurement: kW
        input_type: holding

    # -------------------------------------------------
    switches:
      # coil_register (binäre Daten, nur schreiben)
      # -------------------------------------------------
      - name: "hp_hauptschalter" # Wärmepumpe an/aus
        unique_id: "modbus.hp_hauptschalter"
        slave: !secret lg_heatpump_modbus_slave
        address: 0 # 00001
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
          input_type: coil
          address: 0
          state_on: 1
          state_off: 0

      - name: "hp_dhw" # Warmwasserbereitung an/aus
        unique_id: "modbus.hp_dhw"
        slave: !secret lg_heatpump_modbus_slave
        address: 1 # 00002
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
          input_type: coil
          address: 1
          state_on: 1
          state_off: 0

      - name: "LG WP Ruhemodus"
        unique_id: "modbus.hp_silent_mode"
        slave: !secret lg_heatpump_modbus_slave
        address: 2 # 00003
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
          input_type: coil
          address: 2
          state_on: 1
          state_off: 0

      - name: "hp_dhw_desinfection_mode" # Desinfektionsmodus an/aus
        unique_id: "modbus.hp_dhw_desinfection_mode"
        slave: !secret lg_heatpump_modbus_slave
        address: 3 # 00004
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
          input_type: coil
          address: 3
          state_on: 1
          state_off: 0

      - name: "hp_emergency_stop"
        unique_id: "modbus.hp_emergency_stop"
        slave: !secret lg_heatpump_modbus_slave
        address: 4 # 00005
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
          input_type: coil
          address: 2
          state_on: 1
          state_off: 0

      - name: "hp_emergency_stop_switch"
        unique_id: "modbus.hp_emergency_stop_switch"
        slave: !secret lg_heatpump_modbus_slave
        address: 5 # 00006
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
          input_type: coil
          address: 3
          state_on: 1
          state_off: 0

      - name: "hp_active_power_limitation"
        unique_id: "modbus.hp_active_power_limitation"
        slave: !secret lg_heatpump_modbus_slave
        address: 6 # 00007
        write_type: coil
        command_on: 1
        command_off: 0
        verify:
          input_type: coil
          address: 3
          state_on: 1
          state_off: 0

    # -----------------------------------------
    binary_sensors:
      # discrete_input (binäre Daten, nur lesen)
      # -----------------------------------------
      - name: "hp_water_flow_status"
        unique_id: "modbus.hp_water_flow_status"
        scan_interval: 30
        address: 0 # 10001
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input
        device_class: problem # 0: OK, 1: zu niedrig

      - name: "hp_water_pump_status"
        unique_id: "modbus.hp_water_pump_status"
        scan_interval: 30
        address: 1 # 10002
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input
        device_class: running

      - name: "hp_ext_water_pump_status"
        unique_id: "modbus.hp_ext_water_pump_status"
        scan_interval: 30
        address: 2 # 10003
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input
        device_class: running

      - name: "hp_compressor_status"
        unique_id: "modbus.hp_compressor_status"
        scan_interval: 30
        address: 3 # 10004
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input
        device_class: running

      - name: "hp_defrosting_status"
        unique_id: "modbus.hp_defrosting_status"
        scan_interval: 30
        address: 4 # 10005
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input
        device_class: running

      - name: "hp_dhw_heating_status"
        unique_id: "modbus.hp_dhw_heating_status"
        scan_interval: 30
        address: 5 # 10006
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input
        device_class: running

      - name: "hp_dhw_tank_desinfection_status"
        unique_id: "modbus.hp_dhw_tank_desinfection_status"
        scan_interval: 30
        address: 6 # 10007
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input
        device_class: running

      - name: "hp_silent_mode_status"
        unique_id: "modbus.hp_silent_mode_status"
        scan_interval: 30
        address: 7 # 10008
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input

      - name: "hp_cooling_status"
        unique_id: "modbus.hp_cooling_status"
        scan_interval: 30
        address: 8 # 10009
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input
        device_class: running

      - name: "hp_solar_pump_status"
        unique_id: "modbus.hp_solar_pump_status"
        scan_interval: 30
        address: 9  # 10010
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input
        device_class: running

      - name: "hp_backup_heater_step1_status"
        unique_id: "modbus.hp_backup_heater_step1_status"
        scan_interval: 30
        address: 10 # 10011
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input
        device_class: running

      - name: "hp_backup_heater_step2_status"
        unique_id: "modbus.hp_backup_heater_step2_status"
        scan_interval: 30
        address: 11 # 10012
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input
        device_class: running

      - name: "hp_dhw_boost_heater_status"
        unique_id: "modbus.hp_dhw_boost_heater_status"
        scan_interval: 30
        address: 12 # 10013
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input
        device_class: running

      - name: "hp_error_status"
        unique_id: "modbus.hp_error_status"
        scan_interval: 30
        address: 13 # 10014
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input
        device_class: problem

      - name: "hp_emergency_operation_available_space_heating_cooling"
        unique_id: "modbus.hp_emergency_operation_available_space_heating_cooling"
        scan_interval: 30
        address: 14 # 10015
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input

      - name: "hp_emergency_operation_available_dhw"
        unique_id: "modbus.hp_emergency_operation_available_dhw"
        scan_interval: 30
        address: 15 # 10016
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input

      - name: "hp_mix_pump_status"
        unique_id: "modbus.hp_mix_pump_status"
        scan_interval: 30
        address: 16 # 10017
        slave: !secret lg_heatpump_modbus_slave
        input_type: discrete_input
        device_class: running

template:
  # Template sensors for better readability
  #-----------------------------------------
  - select:
    - name: "hp_operation_mode_select"
      unique_id: hp_operation_mode_select
      icon: mdi:hvac
      options: >
        {{ [
          'Cooling', 
          'Auto', 
          'Heating',
        ] }}
      state: >
        {% set raw = states('sensor.hp_operation_mode_raw') %}
        {% if raw in ['unavailable', 'unknown', 'none'] %}
          unavailable
        {% else %}
          {% set status_mapping = {
          '0': 'Cooling',
          '3': 'Auto',
          '4': 'Heating',
          } %}
          {{ status_mapping.get(raw, 'Auto') }}
        {% endif %}
        
      select_option:
        - action: modbus.write_register
          data:
            hub: lg_heatpump
            slave: !secret lg_heatpump_modbus_slave
            address: 9
            value: >
              {% set reverse_mapping = {
                'Cooling': 0,
                'Auto': 3,
                'Heating': 4
              } %}
              {{ reverse_mapping.get(option, 3) }}
    - name: "hp_control_method_select"
      unique_id: hp_control_method_select
      icon: mdi:home-thermometer
      options: >
        {{ [
          'Water Outlet Temperature Control', 
          'Water Inlet Temperature Control', 
          'Room Air Control'',
        ] }}
      state: >
        {% set raw = states('sensor.hp_control_method_raw') %}
        {% if raw in ['unavailable', 'unknown', 'none'] %}
          unavailable
        {% else %}
          {% set status_mapping = {
          '0': 'Water Outlet Temperature Control',
          '1': 'Water Inlet Temperature Control',
          '2': 'Room Air Control',
          } %}
          {{ status_mapping.get(raw, 'Wasserauslasstemp. Steuerung') }}
        {% endif %}
        
      select_option:
        - action: modbus.write_register
          data:
            hub: lg_heatpump
            slave: !secret lg_heatpump_modbus_slave
            address: 9
            value: >
              {% set reverse_mapping = {
                'Water Outlet Temperature Control': 0,
                'Water Inlet Temperature Control': 1,
                'Room Air Control': 2
              } %}
              {{ reverse_mapping.get(option, 0) }}
    - name: "hp_energy_state_select"
      unique_id: hp_energy_state_select
      icon: mdi:transmission-tower
      options: >
        {{ [
          'Not used', 
          'Forced Off', 
          'Normal Operation', 
          'On - Recommendation', 
          'On - Command', 
          'On - Command Step 2', 
          'On - Recommendation Step 1', 
          'Power Saving Mode', 
          'Super Power Saving Mode'
        ] }}
      state: >
        {% set raw = states('sensor.hp_energy_state_raw') %}
        {% if raw in ['unavailable', 'unknown', 'none'] %}
          unavailable
        {% else %}
          {% set status_mapping = {
            '0': 'Not used',
            '1': 'Forced Off',
            '2': 'Normal Operation',
            '3': 'On Recommendation',
            '4': 'On Command',
            '5': 'On Command Step 2',
            '6': 'On - Recommendation Step 1',
            '7': 'Power-saving mode',
            '8': 'Super power-saving mode'
          } %}
          {{ status_mapping.get(raw, 'Nicht verwendet') }}
        {% endif %}
        
      select_option:
        - action: modbus.write_register
          data:
            hub: lg_heatpump
            slave: !secret lg_heatpump_modbus_slave
            address: 9
            value: >
              {% set reverse_mapping = {
                'Not used': 0,
                'Forced Off': 1,
                'Normal operation': 2,
                'On - Recommendation': 3,
                'On - Command': 4,
                'On - Command Step 2': 5,
                'On - Recommendation Step 1': 6,
                'Power Saving Mode': 7,
                'Super Power Saving Mode': 8
              } %}
              {{ reverse_mapping.get(option, 0) }}
  - number:
    - name: "hp_shift_value_in_auto_mode_circuit1_number"
      unique_id: hp_shift_value_in_auto_mode_circuit1_number
      icon: mdi:thermometer-auto
      state: "{{ states('sensor.hp_shift_value_in_auto_mode_circuit1') | float(0) }}"
      min: -5
      max: 5
      step: 1
      unit_of_measurement: "K"
      set_value:
        - action: modbus.write_register
          data:
            hub: lg_heatpump
            slave: !secret lg_heatpump_modbus_slave
            address: 4
            value: >
              {% set val = value | int %}
              {% if val < 0 %}
                {{ val + 65536 }}
              {% else %}
                {{ val }}
              {% endif %}
    - name: "hp_shift_value_in_auto_mode_circuit2_number"
      unique_id: hp_shift_value_in_auto_mode_circuit2_number
      icon: mdi:thermometer-auto
      state: "{{ states('sensor.hp_shift_value_in_auto_mode_circuit2') | float(0) }}"
      min: -5
      max: 5
      step: 1
      unit_of_measurement: "K"
      set_value:
        - action: modbus.write_register
          data:
            hub: lg_heatpump
            slave: !secret lg_heatpump_modbus_slave
            address: 7
            value: >
              {% set val = value | int %}
              {% if val < 0 %}
                {{ val + 65536 }}
              {% else %}
                {{ val }}
              {% endif %}
    # ==========================================
    # HK1 Solltemperatur (Heizkörper)
    # ==========================================
    - name: "hp_hk1_target_temperatur_number"
      unique_id: hp_hk1_target_temperatur_number
      icon: mdi:radiator
      state: "{{ states('sensor.hp_target_temp_circuit1') | float(0) }}"
      min: 30
      max: 50
      step: 1
      unit_of_measurement: "°C"
      set_value:
        - action: modbus.write_register
          data:
            hub: lg_heatpump
            slave: !secret lg_heatpump_modbus_slave
            address: 2
            value: "{{ (value | float * 10) | int }}"

    # ==========================================
    # HK2 Solltemperatur (Fußbodenheizung)
    # ==========================================
    - name: "hp_hk2_target_temperatur_number"
      unique_id: hp_hk2_target_temperatur_number
      icon: mdi:heating-coil
      state: "{{ states('sensor.hp_target_temp_circuit2') | float(0) }}"
      min: 20
      max: 40
      step: 1
      unit_of_measurement: "°C"
      set_value:
        - action: modbus.write_register
          data:
            hub: lg_heatpump
            slave: !secret lg_heatpump_modbus_slave
            address: 5
            value: "{{ (value | float * 10) | int }}"

